---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: transformers
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./applications/transformers
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: transformers
  targetNamespace: default
  timeout: 3m0s
  wait: true
  patches:
    - patch: |-
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: transformers-ingress
          namespace: default
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Transformers
            gethomepage.dev/description: Transformers Database
            gethomepage.dev/group: Apps
            gethomepage.dev/icon: https://transformers.ndlovucloud.co.zw/static/favicon.svg
            gethomepage.dev/pod-selector: "app=transformers"
