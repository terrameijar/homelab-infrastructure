apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker-config
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  # SQLite needs local filesystem locking; do not move this volume to NFS.
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-tracker
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speedtest-tracker
  template:
    metadata:
      labels:
        app: speedtest-tracker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: speedtest-tracker
          image: lscr.io/linuxserver/speedtest-tracker:version-v1.15.0
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Africa/Harare
            - name: DISPLAY_TIMEZONE
              value: Africa/Harare
            - name: APP_URL
              value: https://speedtest.ndlovucloud.co.zw
            - name: ASSET_URL
              value: https://speedtest.ndlovucloud.co.zw
            - name: DB_CONNECTION
              value: sqlite
            - name: SPEEDTEST_SCHEDULE
              value: "0 */6 * * *"
          envFrom:
            - secretRef:
                name: speedtest-tracker-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: speedtest-tracker-config
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-tracker
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: speedtest-tracker
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speedtest-tracker
  namespace: default
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: speedtest-tracker.png
    gethomepage.dev/name: Speedtest Tracker
    gethomepage.dev/description: Internet speed and latency history
    gethomepage.dev/pod-selector: "app=speedtest-tracker"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - speedtest.ndlovucloud.co.zw
      secretName: speedtest-tracker-prod-tls-secret
  rules:
    - host: speedtest.ndlovucloud.co.zw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speedtest-tracker
                port:
                  number: 80
