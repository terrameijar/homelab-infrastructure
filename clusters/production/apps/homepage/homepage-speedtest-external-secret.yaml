apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: homepage-speedtest-env
  namespace: default
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: homepage-speedtest-env
    creationPolicy: Owner
  data:
    - secretKey: HOMEPAGE_VAR_SPEEDTEST_API_KEY
      remoteRef:
        key: /K8s/Clusters/Prod/SpeedtestTracker/homepage-api-token
