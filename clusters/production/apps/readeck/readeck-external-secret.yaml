apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: readeck-env
  namespace: default
spec:
  refreshInterval: 2h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: readeck-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /K8s/Clusters/Prod/Readeck/credentials
