apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  interval: 10m
  chart:
    spec:
      chart: uptime-kuma
      version: "2.21.3"
      sourceRef:
        kind: HelmRepository
        name: uptime-kuma
        namespace: flux-system
      interval: 60m
  values:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: uptime-kuma.vuyisile.lan
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      size: 1Gi
